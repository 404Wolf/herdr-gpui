name: Website

# Deploys site/ to the herdrui-site Cloudflare Worker, which serves
# https://herdrui.dev. Needs the CLOUDFLARE_API_TOKEN (Workers Scripts: Edit,
# Workers Routes: Edit, Zone: Read on herdrui.dev) and CLOUDFLARE_ACCOUNT_ID
# repository secrets, scoped to the `website` environment.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: website
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'penso/herdr-gpui'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    environment:
      name: website
      url: https://herdrui.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.144.0"
          workingDirectory: site
          command: deploy
