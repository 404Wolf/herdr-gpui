[package]
edition.workspace      = true
license.workspace      = true
name                   = "herdr-remote"
publish.workspace      = true
rust-version.workspace = true
version.workspace      = true

[lints]
workspace = true

[dependencies]
base64.workspace                 = true
chrono.workspace                 = true
getrandom.workspace              = true
herdr-client.workspace           = true
herdr-control-protocol.workspace = true
herdr-credentials.workspace      = true
percent-encoding.workspace       = true
rustls                           = { optional = true, workspace = true }
secrecy.workspace                = true
serde.workspace                  = true
serde_json.workspace             = true
sha2.workspace                   = true
tar.workspace                    = true
tempfile.workspace               = true
thiserror.workspace              = true
tracing.workspace                = true
tungstenite                      = { optional = true, workspace = true }
ureq.workspace                   = true
url.workspace                    = true
uuid.workspace                   = true
webpki-roots                     = { optional = true, workspace = true }
zeroize.workspace                = true

[target.'cfg(unix)'.dependencies]
nix.workspace    = true
rustix.workspace = true

[dev-dependencies]
herdr-client = { features = ["test-support"], workspace = true }
toml.workspace = true

[features]
# Machines from cloud providers as devices: the saved device list, the
# connector, and running scripts on them. Turned on by each provider below;
# not useful alone.
cloud = ["herdr-client/cloud"]
# Azure VMs and Container Apps sandboxes, reached over the data plane's exec stream.
azure = ["cloud", "herdr-client/azure", "dep:rustls", "dep:tungstenite", "dep:webpki-roots"]
boat = ["cloud", "herdr-client/boat"]
coder = ["cloud", "herdr-client/coder"]
container = ["cloud", "herdr-client/container"]
daytona = ["cloud", "herdr-client/daytona"]
# Sandboxes on a self-hosted OpenSandbox server, with this app as their exec relay.
opensandbox = ["cloud", "herdr-client/opensandbox", "dep:rustls", "dep:tungstenite", "dep:webpki-roots"]
railway = ["cloud", "herdr-client/railway"]
# Fly Sprites, with this app as their exec relay.
sprites = ["cloud", "herdr-client/sprites", "dep:rustls", "dep:tungstenite", "dep:webpki-roots"]
# Shared fixtures (provider settings, a mock server) for the app's own tests.
test-support = []
